# Interface drift against sbeam's moving tip.
#
# The round-trip gate in ci.yml runs against a **pinned** sbeam commit, so an
# unrelated sbeam change can never redden an unrelated sloads PR. That pin is
# also how interface drift hides: nothing would notice sbeam changing under us
# until someone bumped it and had to debug the difference cold.
#
# This job runs the same gate against sbeam `main` once a week and is
# `continue-on-error` throughout: its failure is a notification that the pin
# needs a look, never a merge block. Bump procedure:
# docs/10_standard/PROJECT_GUIDE.md, "sbeam pin".
#
# **The notification is an issue, not a run (#188, review R-18).** A red
# scheduled run only shows on the Actions page, which nobody is required to
# visit -- a notification nobody receives is not one. The last step files, or
# comments on, one pinned issue, and closes it on the first run that goes green
# again, so drift lands where work is planned and leaves the same way.
name: sbeam drift

on:
  schedule:
    # Mondays, 06:00 UTC -- before the working week, after the weekend's commits.
    - cron: "0 6 * * 1"
  workflow_dispatch:

# Read the tree, write the one issue below. Nothing else.
permissions:
  contents: read
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies (sbeam at main, NOT the pin)
        run: |
          pip install --upgrade pip
          pip install -e '.[dev]'
          pip install "sbeam @ git+https://github.com/Sean074/sbeam.git@main"

      - name: Report the sbeam commit under test
        run: pip show sbeam

      # `id` and the step-level `continue-on-error` are both load-bearing for the
      # notification below, and neither is obvious: without the latter a red gate
      # skips every later step, so the step whose whole job is to report the
      # failure is the one the failure suppresses. Guard:
      # tests/test_sbeam_drift_notification.py.
      - name: Round-trip gate against sbeam main
        id: roundtrip
        continue-on-error: true
        env:
          SLOADS_REQUIRE_SBEAM: "1"
          STREAMLIT_SERVER_HEADLESS: "true"
        run: pytest -m roundtrip -v --tb=short --no-cov

      # One step for both outcomes on purpose: filing and clearing share the
      # find-the-issue half, and two steps would be two spellings of the title
      # that identifies it -- which is exactly how an auto-filer starts opening a
      # fresh issue every Monday instead of updating Monday-before-last's.
      - name: File, update or clear the drift issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.roundtrip.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          # Exported because the jq filter reads it as $ENV.TITLE: `--search` is a
          # fuzzy full-text query, so it is a candidate list, and the exact-title
          # compare below is what actually identifies the issue.
          export TITLE="sbeam interface drift: the weekly gate against sbeam main is failing"

          # Matched by title rather than by label: `gh issue create` fails on a
          # label the repository has not created, and a notifier that can fail
          # closed is worse than the Actions page it is replacing.
          find_issue() {
            gh issue list --state open --search "$TITLE in:title" --json number,title \
              --jq 'map(select(.title == $ENV.TITLE)) | .[0].number // empty'
          }

          # Only a gate that actually ran may move the issue. If setup failed the
          # outcome is `skipped`, and treating that as green would close a live
          # drift report on the strength of a test that never executed.
          case "$OUTCOME" in
            failure|success) ;;
            *) echo "the gate did not run (outcome: ${OUTCOME:-none}); leaving the issue alone"
               exit 0 ;;
          esac

          NUM="$(find_issue)"
          TODAY="$(date -u +%Y-%m-%d)"

          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$NUM" ]; then
              echo "green, and no drift issue open -- nothing to do"
              exit 0
            fi
            gh issue comment "$NUM" --body \
              "Cleared: the gate against sbeam \`main\` is green again as of $TODAY. Run: $RUN_URL"
            gh issue unpin "$NUM" || true
            gh issue close "$NUM"
            echo "closed #$NUM"
            exit 0
          fi

          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body "Still drifting as of $TODAY. Run: $RUN_URL"
            echo "commented on #$NUM"
            exit 0
          fi

          BODY="$RUNNER_TEMP/sbeam-drift-body.md"
          cat > "$BODY" <<'EOF'
          The weekly `sbeam drift` workflow runs the round-trip gate against sbeam
          `main` rather than the commit pinned in `pyproject.toml`, and it is failing.

          **This is a notification, not a merge block.** `main` and every pull request
          still gate on the pin, so nothing is broken for anyone today. What it means is
          that the pin has drifted from sbeam's tip and the next bump has work in it.

          Bump procedure: `docs/10_standard/PROJECT_GUIDE.md`, "The `solver` extra and
          the sbeam pin" -- its step 3 (`pytest -m roundtrip` green *before* the bump is
          committed) is where this gets resolved.

          Filed and updated by `.github/workflows/sbeam-drift.yml`: it comments here on
          every weekly run that is still red, and closes itself on the first one that is
          green again (#188, review R-18).
          EOF
          printf '\nFirst failing run: %s\n' "$RUN_URL" >> "$BODY"

          # `gh issue create` prints the issue URL; the number is its last segment.
          URL="$(gh issue create --title "$TITLE" --body-file "$BODY")"
          NUM="${URL##*/}"
          # Pinning is best effort: GitHub allows three pinned issues per repository,
          # and a full board must not redden the step that reports the drift.
          gh issue pin "$NUM" || echo "could not pin #$NUM (three pins already?)"
          echo "opened #$NUM at $URL"
